name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests

  viewer-quality:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Sync BoardGate oracle
        working-directory: .
        run: uv sync --locked
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build:check

  viewer-browsers:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Sync BoardGate CLI
        working-directory: .
        run: uv sync --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups
      - name: Verify declared Python runtime
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: >-
          uv run python -c
          "import os, sys;
          actual = f'{sys.version_info.major}.{sys.version_info.minor}';
          expected = os.environ['EXPECTED_PYTHON'];
          assert actual == expected, f'expected Python {expected}, got {actual}'"
      - run: uv run pytest --cov=boardgate --cov-branch --cov-fail-under=85

  cli-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pcb-review --version
      - name: Run complete review smoke test
        run: >-
          uv run pcb-review inspect
          tests/fixtures/valid_minimal_board
          --rules rules/default.yaml
          --output boardgate-smoke-output
